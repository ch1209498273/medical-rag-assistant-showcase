<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="一条答案的旅程与三道闸门">
  <defs>
    <linearGradient id="pbg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#0C1727"/>
    </linearGradient>
    <linearGradient id="pcard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#122640"/>
      <stop offset="100%" stop-color="#0D1C2F"/>
    </linearGradient>
    <linearGradient id="pgate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132A44"/>
      <stop offset="100%" stop-color="#0E2036"/>
    </linearGradient>
    <marker id="pa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38BDF8" fill-opacity="0.8"/>
    </marker>
    <marker id="pr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#F87171" fill-opacity="0.9"/>
    </marker>
  </defs>

  <rect width="1200" height="440" fill="url(#pbg2)"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <text x="40" y="46" fill="#64748B" font-size="13" letter-spacing="2.6">THE JOURNEY OF ONE ANSWER</text>
    <text x="40" y="86" fill="#E2E8F0" font-size="27" font-weight="700">一条答案要过三道闸门，才允许出现在屏幕上</text>

    <!-- 六个环节 -->
    <g>
      <rect x="40" y="120" width="140" height="98" rx="11" fill="url(#pcard)" stroke="#38BDF8" stroke-opacity="0.40"/>
      <text x="110" y="152" fill="#7DD3FC" font-size="12">01</text>
      <text x="110" y="176" fill="#E2E8F0" font-size="15" text-anchor="middle" font-weight="600">解析定位</text>
      <text x="110" y="198" fill="#64748B" font-size="11.5" text-anchor="middle">页码 · 段落</text>

      <rect x="236" y="120" width="140" height="98" rx="11" fill="url(#pcard)" stroke="#38BDF8" stroke-opacity="0.40"/>
      <text x="306" y="152" fill="#7DD3FC" font-size="12">02</text>
      <text x="306" y="176" fill="#E2E8F0" font-size="15" text-anchor="middle" font-weight="600">切片索引</text>
      <text x="306" y="198" fill="#64748B" font-size="11.5" text-anchor="middle">内容哈希 · 版本</text>

      <rect x="432" y="120" width="140" height="98" rx="11" fill="url(#pcard)" stroke="#38BDF8" stroke-opacity="0.40"/>
      <text x="502" y="152" fill="#7DD3FC" font-size="12">03</text>
      <text x="502" y="176" fill="#E2E8F0" font-size="15" text-anchor="middle" font-weight="600">召回重排</text>
      <text x="502" y="198" fill="#64748B" font-size="11.5" text-anchor="middle">≤20 → ≤6 条</text>

      <rect x="628" y="120" width="140" height="98" rx="11" fill="url(#pcard)" stroke="#22D3EE" stroke-opacity="0.55"/>
      <text x="698" y="152" fill="#67E8F9" font-size="12">04</text>
      <text x="698" y="176" fill="#E2E8F0" font-size="15" text-anchor="middle" font-weight="600">证据闭包</text>
      <text x="698" y="198" fill="#64748B" font-size="11.5" text-anchor="middle">跨文档必达项</text>

      <rect x="824" y="120" width="140" height="98" rx="11" fill="url(#pcard)" stroke="#A78BFA" stroke-opacity="0.55"/>
      <text x="894" y="152" fill="#C4B5FD" font-size="12">05</text>
      <text x="894" y="176" fill="#E2E8F0" font-size="15" text-anchor="middle" font-weight="600">生成核验</text>
      <text x="894" y="198" fill="#64748B" font-size="11.5" text-anchor="middle">逐条断言回查</text>

      <rect x="1020" y="120" width="140" height="98" rx="11" fill="url(#pcard)" stroke="#34D399" stroke-opacity="0.60"/>
      <text x="1090" y="152" fill="#6EE7B7" font-size="12">06</text>
      <text x="1090" y="176" fill="#E2E8F0" font-size="15" text-anchor="middle" font-weight="600">发布</text>
      <text x="1090" y="198" fill="#64748B" font-size="11.5" text-anchor="middle">带引用 · 可展开</text>
    </g>

    <!-- 普通箭头 -->
    <line x1="182" y1="169" x2="230" y2="169" stroke="#38BDF8" stroke-width="1.6" stroke-opacity="0.55" marker-end="url(#pa)"/>
    <line x1="378" y1="169" x2="426" y2="169" stroke="#38BDF8" stroke-width="1.6" stroke-opacity="0.55" marker-end="url(#pa)"/>

    <!-- 闸门 -->
    <g>
      <rect x="580" y="126" width="42" height="86" rx="8" fill="url(#pgate)" stroke="#F87171" stroke-opacity="0.55"/>
      <text x="601" y="158" fill="#FCA5A5" font-size="15" text-anchor="middle" font-weight="600">闸</text>
      <text x="601" y="180" fill="#FCA5A5" font-size="12" text-anchor="middle">①</text>
      <line x1="601" y1="212" x2="601" y2="262" stroke="#F87171" stroke-width="1.3" stroke-opacity="0.5" stroke-dasharray="3 4"/>

      <rect x="776" y="126" width="42" height="86" rx="8" fill="url(#pgate)" stroke="#F87171" stroke-opacity="0.55"/>
      <text x="797" y="158" fill="#FCA5A5" font-size="15" text-anchor="middle" font-weight="600">闸</text>
      <text x="797" y="180" fill="#FCA5A5" font-size="12" text-anchor="middle">②</text>
      <line x1="797" y1="212" x2="797" y2="262" stroke="#F87171" stroke-width="1.3" stroke-opacity="0.5" stroke-dasharray="3 4"/>

      <rect x="972" y="126" width="42" height="86" rx="8" fill="url(#pgate)" stroke="#F87171" stroke-opacity="0.55"/>
      <text x="993" y="158" fill="#FCA5A5" font-size="15" text-anchor="middle" font-weight="600">闸</text>
      <text x="993" y="180" fill="#FCA5A5" font-size="12" text-anchor="middle">③</text>
      <line x1="993" y1="212" x2="993" y2="262" stroke="#F87171" stroke-width="1.3" stroke-opacity="0.5" stroke-dasharray="3 4"/>
    </g>

    <!-- 失败旁路 -->
    <line x1="601" y1="262" x2="1152" y2="262" stroke="#F87171" stroke-width="1.4" stroke-opacity="0.55"/>
    <line x1="797" y1="262" x2="797" y2="262" stroke="#F87171" stroke-width="1.4"/>
    <line x1="586" y1="262" x2="1150" y2="262" stroke="#F87171" stroke-width="1.4" stroke-opacity="0.55" marker-end="url(#pr)"/>
    <text x="528" y="284" fill="#F87171" font-size="13">任一闸门不通过 → 整条拒答，返回固定 reason code，绝不拼凑、不降级成猜测</text>

    <!-- 闸门判据 -->
    <line x1="40" y1="308" x2="1160" y2="308" stroke="#1B2A40"/>

    <text x="40" y="336" fill="#7DD3FC" font-size="12.5" letter-spacing="1.2">闸门①　相关性门</text>
    <text x="40" y="360" fill="#8A97A8" font-size="13">最高分不足 0.35：资料里可能确实没有，直接说没找到</text>

    <text x="446" y="336" fill="#67E8F9" font-size="12.5" letter-spacing="1.2">闸门②　证据闭包 + 充分性</text>
    <text x="446" y="360" fill="#8A97A8" font-size="13">"先看 A，A 又指向 B"——B 不在证据里就拒答；只剩导航句也算不足</text>

    <text x="880" y="336" fill="#C4B5FD" font-size="12.5" letter-spacing="1.2">闸门③　逐 claim 核验</text>
    <text x="880" y="360" fill="#8A97A8" font-size="13">每条断言回查证据，查不到就整条不发</text>

    <text x="40" y="410" fill="#7A8A9C" font-size="12.5">答案先完整缓冲，校验通过才发出第一个字——用户永远不会看到"正在生成中、尚未校验"的半成品。</text>
  </g>
</svg>
