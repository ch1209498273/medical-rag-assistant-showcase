<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="双运行模式与系统架构">
  <defs>
    <linearGradient id="abg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#0C1526"/>
    </linearGradient>
    <linearGradient id="amode" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12253D"/>
      <stop offset="100%" stop-color="#0D1C2F"/>
    </linearGradient>
    <linearGradient id="achain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0F2941"/>
      <stop offset="100%" stop-color="#1A1E3D"/>
    </linearGradient>
    <marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#38BDF8" fill-opacity="0.8"/>
    </marker>
  </defs>

  <rect width="1200" height="400" fill="url(#abg2)"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <text x="40" y="44" fill="#64748B" font-size="13" letter-spacing="2.6">RUNTIME</text>
    <text x="40" y="82" fill="#E2E8F0" font-size="26" font-weight="700">两种运行模式，一条链路；切换是显式的，不会偷偷发生</text>

    <!-- 模式卡 -->
    <rect x="40" y="106" width="540" height="86" rx="12" fill="url(#amode)" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="64" y="134" fill="#6EE7B7" font-size="15" font-weight="600">Demo 模式</text>
    <text x="64" y="158" fill="#8A97A8" font-size="13">零网络 · 无需 Key · 确定性输出</text>
    <text x="64" y="178" fill="#5B6B80" font-size="12">同样的输入永远给同样的结果，用于复现与演示</text>

    <rect x="620" y="106" width="540" height="86" rx="12" fill="url(#amode)" stroke="#38BDF8" stroke-opacity="0.45"/>
    <text x="644" y="134" fill="#7DD3FC" font-size="15" font-weight="600">Cloud 模式</text>
    <text x="644" y="158" fill="#8A97A8" font-size="13">DeepSeek + SiliconFlow · 运行者自备 Key</text>
    <text x="644" y="178" fill="#5B6B80" font-size="12">Key 只从本机 .env 读取，前端拿不到、日志不打印</text>

    <line x1="310" y1="194" x2="310" y2="222" stroke="#34D399" stroke-width="1.6" stroke-opacity="0.6" marker-end="url(#aa)"/>
    <line x1="890" y1="194" x2="890" y2="222" stroke="#38BDF8" stroke-width="1.6" stroke-opacity="0.6" marker-end="url(#aa)"/>

    <!-- 主链路 -->
    <rect x="40" y="228" width="1120" height="72" rx="12" fill="url(#achain)" stroke="#38BDF8" stroke-opacity="0.28"/>
    <g font-size="13" text-anchor="middle">
      <text x="140" y="258" fill="#7DD3FC">资料接入</text>
      <text x="140" y="278" fill="#64748B" font-size="11.5">解析 · 定位</text>

      <text x="330" y="258" fill="#7DD3FC">检索</text>
      <text x="330" y="278" fill="#64748B" font-size="11.5">召回 · 重排</text>

      <text x="520" y="258" fill="#67E8F9">证据门</text>
      <text x="520" y="278" fill="#64748B" font-size="11.5">闭包 · 充分性</text>

      <text x="710" y="258" fill="#C4B5FD">生成</text>
      <text x="710" y="278" fill="#64748B" font-size="11.5">结构化答案</text>

      <text x="900" y="258" fill="#C4B5FD">核验</text>
      <text x="900" y="278" fill="#64748B" font-size="11.5">逐 claim 回查</text>

      <text x="1070" y="258" fill="#6EE7B7">发布 / 拒答</text>
      <text x="1070" y="278" fill="#64748B" font-size="11.5">SSE 事件</text>
    </g>
    <g stroke="#38BDF8" stroke-width="1.3" stroke-opacity="0.35">
      <line x1="200" y1="264" x2="270" y2="264"/>
      <line x1="390" y1="264" x2="460" y2="264"/>
      <line x1="580" y1="264" x2="650" y2="264"/>
      <line x1="770" y1="264" x2="840" y2="264"/>
      <line x1="960" y1="264" x2="1012" y2="264"/>
    </g>

    <!-- 存储 -->
    <line x1="260" y1="300" x2="260" y2="326" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="600" y1="300" x2="600" y2="326" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>
    <line x1="940" y1="300" x2="940" y2="326" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.4"/>

    <rect x="40" y="328" width="440" height="56" rx="10" fill="#101F35" stroke="#1E3A54"/>
    <text x="260" y="352" fill="#E2E8F0" font-size="14" text-anchor="middle">SQLite</text>
    <text x="260" y="371" fill="#64748B" font-size="12" text-anchor="middle">文档版本 · 会话 · 引用 · 反馈</text>

    <rect x="500" y="328" width="400" height="56" rx="10" fill="#101F35" stroke="#1E3A54"/>
    <text x="700" y="352" fill="#E2E8F0" font-size="14" text-anchor="middle">Qdrant Local</text>
    <text x="700" y="371" fill="#64748B" font-size="12" text-anchor="middle">向量与 active version 过滤</text>

    <rect x="920" y="328" width="240" height="56" rx="10" fill="#101F35" stroke="#1E3A54"/>
    <text x="1040" y="352" fill="#E2E8F0" font-size="14" text-anchor="middle">哈希链审计</text>
    <text x="1040" y="371" fill="#64748B" font-size="12" text-anchor="middle">写入失败即拒绝操作</text>
  </g>
</svg>
