<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="评测结果">
  <defs>
    <linearGradient id="mbg2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#0C1728"/>
    </linearGradient>
    <linearGradient id="nA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="nB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#DDD6FE"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="nC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#mbg2)"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" text-anchor="middle">
    <g>
      <text x="200" y="96" fill="url(#nC)" font-size="58" font-weight="700">0</text>
      <text x="200" y="136" fill="#CBD5E1" font-size="17">错误答案被发布</text>
      <text x="200" y="164" fill="#5B6B80" font-size="14">贯穿全部评测批次</text>
    </g>
    <g>
      <text x="600" y="96" fill="url(#nA)" font-size="58" font-weight="700">6/6</text>
      <text x="600" y="136" fill="#CBD5E1" font-size="17">确认批正例通过</text>
      <text x="600" y="164" fill="#5B6B80" font-size="14">完整引用链 + 值匹配</text>
    </g>
    <g>
      <text x="1000" y="96" fill="url(#nA)" font-size="58" font-weight="700">10/10</text>
      <text x="1000" y="136" fill="#CBD5E1" font-size="17">补充批答案值全对</text>
      <text x="1000" y="164" fill="#5B6B80" font-size="14">绕过检索，直测推理</text>
    </g>

    <line x1="56" y1="192" x2="1144" y2="192" stroke="#1B2A40" stroke-width="1"/>

    <g>
      <text x="200" y="252" fill="url(#nB)" font-size="58" font-weight="700">9</text>
      <text x="200" y="292" fill="#CBD5E1" font-size="17">份独立留出批</text>
      <text x="200" y="320" fill="#5B6B80" font-size="14">其中 1 份因夹具缺陷作废并披露</text>
    </g>
    <g>
      <text x="600" y="252" fill="url(#nB)" font-size="58" font-weight="700">80</text>
      <text x="600" y="292" fill="#CBD5E1" font-size="17">道冻结评测题</text>
      <text x="600" y="320" fill="#5B6B80" font-size="14">64 可回答 + 16 无答案</text>
    </g>
    <g>
      <text x="1000" y="252" fill="url(#nC)" font-size="58" font-weight="700">3785</text>
      <text x="1000" y="292" fill="#CBD5E1" font-size="17">项后端测试通过</text>
      <text x="1000" y="320" fill="#5B6B80" font-size="14">CI 连续 9 次全绿</text>
    </g>
