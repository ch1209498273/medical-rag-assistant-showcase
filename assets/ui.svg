<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="界面结构示意">
  <defs>
    <linearGradient id="ubg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1220"/>
      <stop offset="100%" stop-color="#0C1728"/>
    </linearGradient>
    <linearGradient id="ubar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#122740"/>
      <stop offset="100%" stop-color="#101F35"/>
    </linearGradient>
    <linearGradient id="umsg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132A45"/>
      <stop offset="100%" stop-color="#0E2136"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" fill="url(#ubg)"/>
  <g font-family="'Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif">
    <text x="40" y="40" fill="#64748B" font-size="13" letter-spacing="2.6">INTERFACE</text>
    <text x="40" y="74" fill="#E2E8F0" font-size="24" font-weight="700">界面只有三块，但要让人一眼看出"这句话有没有依据"</text>

    <!-- 外壳 -->
    <rect x="40" y="94" width="1120" height="440" rx="12" fill="#0B1727" stroke="#1E3A54"/>

    <!-- 顶栏 -->
    <rect x="40" y="94" width="1120" height="48" rx="12" fill="url(#ubar)"/>
    <rect x="40" y="130" width="1120" height="12" fill="url(#ubar)"/>
    <text x="64" y="124" fill="#E2E8F0" font-size="14" font-weight="600">医疗知识问答助手</text>
    <rect x="230" y="106" width="126" height="24" rx="12" fill="#1A2E1F" stroke="#34D399" stroke-opacity="0.5"/>
    <circle cx="246" cy="118" r="3.5" fill="#34D399"/>
    <text x="256" y="123" fill="#6EE7B7" font-size="11.5">无 Key 演示模式</text>
    <text x="1136" y="123" fill="#64748B" font-size="12" text-anchor="end">本机运行 · 零外网</text>

    <!-- 左栏 -->
    <rect x="56" y="158" width="196" height="360" rx="10" fill="#0D1B2C" stroke="#1B2A40"/>
    <rect x="68" y="172" width="172" height="32" rx="7" fill="#12263C" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text x="82" y="193" fill="#7DD3FC" font-size="12.5">制度问答</text>
    <rect x="68" y="210" width="172" height="32" rx="7" fill="#0F1E30"/>
    <text x="82" y="231" fill="#8A97A8" font-size="12.5">资料管理</text>

    <rect x="68" y="258" width="172" height="1" fill="#1B2A40"/>
    <text x="68" y="282" fill="#5B6B80" font-size="11">历史会话</text>
    <rect x="68" y="292" width="172" height="26" rx="6" fill="#0F1E30"/>
    <text x="80" y="310" fill="#7A8A9C" font-size="11.5">岗前培训学时</text>
    <rect x="68" y="324" width="172" height="26" rx="6" fill="#0F1E30"/>
    <text x="80" y="342" fill="#7A8A9C" font-size="11.5">补训流程</text>
    <rect x="68" y="356" width="172" height="26" rx="6" fill="#0F1E30"/>
    <text x="80" y="374" fill="#5B6B80" font-size="11.5">报销比例（已拒答）</text>

    <!-- 中栏：消息流 -->
    <rect x="268" y="158" width="596" height="360" rx="10" fill="#0D1B2C" stroke="#1B2A40"/>

    <!-- 用户提问 -->
    <rect x="404" y="176" width="440" height="34" rx="9" fill="#16283E"/>
    <text x="420" y="198" fill="#C8D3E0" font-size="12.5">新员工独立值班前需要完成多少学时岗前培训？</text>

    <!-- 答案卡 -->
    <rect x="292" y="226" width="552" height="128" rx="10" fill="url(#umsg)" stroke="#34D399" stroke-opacity="0.45"/>
    <text x="310" y="250" fill="#6EE7B7" font-size="11.5" letter-spacing="1">答案 · 已核验</text>
    <text x="310" y="274" fill="#DCE5EF" font-size="12.5">新员工独立值班前须完成 24 学时岗前培训，并取得</text>
    <text x="310" y="294" fill="#DCE5EF" font-size="12.5">考核合格证明<tspan fill="#6EE7B7">[1]</tspan>；未通过者需在 7 日内完成补训<tspan fill="#6EE7B7">[2]</tspan>。</text>
    <line x1="310" y1="312" x2="826" y2="312" stroke="#1E3A54"/>
    <text x="310" y="332" fill="#7A8A9C" font-size="11">引用 2 条 · 已通过逐条核验</text>
    <text x="826" y="332" fill="#5B6B80" font-size="11" text-anchor="end">展开全部</text>

    <!-- 拒答卡 -->
    <rect x="292" y="366" width="552" height="94" rx="10" fill="#25131C" stroke="#F87171" stroke-opacity="0.45"/>
    <text x="310" y="390" fill="#FCA5A5" font-size="11.5" letter-spacing="1">已拒答 · NO_EVIDENCE</text>
    <text x="310" y="414" fill="#D8C2C7" font-size="12.5">资料中没有找到关于"血液透析费用报销比例"的依据，</text>
    <text x="310" y="434" fill="#D8C2C7" font-size="12.5">这个问题不在本知识库范围内。</text>

    <!-- 输入框 -->
    <rect x="292" y="474" width="552" height="32" rx="8" fill="#101F33" stroke="#1E3A54"/>
    <text x="308" y="495" fill="#4E5F72" font-size="11.5">继续追问…</text>

    <!-- 右栏：引用面板 -->
    <rect x="880" y="158" width="264" height="360" rx="10" fill="#0D1B2C" stroke="#1B2A40"/>
    <text x="896" y="182" fill="#7DD3FC" font-size="12">引用详情</text>

    <rect x="896" y="194" width="232" height="106" rx="8" fill="#101F33" stroke="#1E3A54"/>
    <text x="908" y="214" fill="#C8D3E0" font-size="11.5">[1] 岗前培训管理办法.pdf</text>
    <text x="908" y="232" fill="#5B6B80" font-size="10.5">第 3 章 · 第 2 页 · 第 4 段</text>
    <line x1="908" y1="242" x2="1116" y2="242" stroke="#1B2A40"/>
    <text x="908" y="260" fill="#8A97A8" font-size="10.5">"新员工独立值班前须完成</text>
    <text x="908" y="276" fill="#8A97A8" font-size="10.5">24 学时岗前培训…"</text>
    <text x="908" y="292" fill="#475569" font-size="10">点击跳转原文位置</text>

    <rect x="896" y="310" width="232" height="88" rx="8" fill="#101F33" stroke="#1E3A54"/>
    <text x="908" y="330" fill="#C8D3E0" font-size="11.5">[2] 培训管理办法.pdf</text>
    <text x="908" y="348" fill="#5B6B80" font-size="10.5">第 5 章 · 第 7 页 · 第 1 段</text>
    <line x1="908" y1="358" x2="1116" y2="358" stroke="#1B2A40"/>
    <text x="908" y="376" fill="#8A97A8" font-size="10.5">"未通过者 7 日内完成补训…"</text>

    <rect x="896" y="410" width="232" height="64" rx="8" fill="#12281F" stroke="#34D399" stroke-opacity="0.28"/>
    <text x="908" y="430" fill="#6EE7B7" font-size="11">证据链完整</text>
    <text x="908" y="448" fill="#7A8A9C" font-size="10.5">2 条引用均为闭包必需项</text>
    <text x="908" y="464" fill="#5B6B80" font-size="10.5">逐 claim 核验通过</text>

    <rect x="896" y="484" width="232" height="22" rx="6" fill="#101F33"/>
    <text x="908" y="499" fill="#5B6B80" font-size="10.5">这条回答有帮助吗？</text>
    <text x="1116" y="499" fill="#3F6B58" font-size="10.5" text-anchor="end">👍 👎</text>
  </g>
</svg>
